services:
  api:
    build: .
    command: serve
    ports:
      - "${PORT:-7779}:7779"
    environment:
      EIA_DATASETS: "${EIA_DATASETS:-STEO,TOTAL,INTL,SEDS,IEO}"
      EIA_DB_PATH: /app/data/eia_bulk.duckdb
      EIA_DATA_DIR: /app/data
    volumes:
      - eia_data:/app/data

volumes:
  eia_data:
